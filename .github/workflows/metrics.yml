name: Omni-Metrics Builder
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with: { python-version: '3.x' }
        
      - name: Install Dependencies
        run: pip install requests

      - name: Generate Futuristic DSA/CP Cards
        run: python scripts/generate_cards.py

      - name: Generate Contribution Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Commit Custom SVGs to Repo
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Auto-generate Live Custom Cards & Snake"
          file_pattern: 'dist/*.svg'

      # CARD 1: Habits & Languages (No Base Stats, No Zeroes)
      - name: Generate Habits & Languages Card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: madhavkapila
          template: classic
          filename: github-metrics-habits.svg
          config_timezone: Asia/Kolkata
          base: "" # This removes all the 0 releases / 0 packages junk
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_charts: yes

      # CARD 2: YouTube Music 
      - name: Generate YT Music Card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: madhavkapila
          template: classic
          filename: github-metrics-music.svg
          config_timezone: Asia/Kolkata
          base: "" 
          plugin_music: yes
          plugin_music_provider: youtube
          plugin_music_mode: playlist
          # IMPORTANT: Put your public YouTube playlist ID here!
          plugin_music_playlist: RDCLAK5uy_kuo_NioExeUmw07dFf8BzQ64DFFTlgE7Q