name: Omni-Metrics Builder
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with: { python-version: '3.x' }
        
      - name: Install Dependencies
        run: pip install requests

      # 1. Generate DSA & CP Cards
      - name: Generate Futuristic DSA/CP Cards
        run: python scripts/generate_cards.py

      # 2. Generate Contribution Snake
      - name: Generate Contribution Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # 3. Generate Trophies LOCALLY (Bypasses dead Vercel servers entirely)
      - name: Generate GitHub Trophies Offline
        uses: ryo-ma/github-profile-trophy@master
        with:
          username: madhavkapila
          output_path: dist/github-trophies.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # 4. Commit all local SVGs to the dist/ folder
      - name: Commit Custom SVGs to Repo
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Auto-generate Live Custom Cards, Trophies & Snake"
          file_pattern: 'dist/*.svg'

      # 5. Lowlighter Graphical Cards
      - name: Generate Habits & Languages Card
        uses: lowlighter/metrics@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: madhavkapila
          template: classic
          filename: dist/github-metrics-habits.svg
          config_timezone: Asia/Kolkata
          base: "" 
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_indepth: yes
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_charts: yes

      - name: Generate YT Music Card
        uses: lowlighter/metrics@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: madhavkapila
          template: classic
          filename: dist/github-metrics-music.svg
          config_timezone: Asia/Kolkata
          base: "" 
          plugin_music: yes
          plugin_music_provider: youtube
          plugin_music_mode: playlist
          plugin_music_playlist: https://music.youtube.com/playlist?list=PLiNce0QIvDSm00HL2FoOskaCFuNTEeR2v

      - name: Generate Isometric Calendar
        uses: lowlighter/metrics@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: madhavkapila
          template: classic
          filename: dist/github-metrics-isocalendar.svg
          config_timezone: Asia/Kolkata
          base: "" 
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year