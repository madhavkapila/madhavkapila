name: Omni-Metrics Builder
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 1. Checkout with full fetch depth to prevent commit conflicts
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # 2. Setup Python & Install Dependencies
      - name: Set up Python
        uses: actions/setup-python@v4
        with: { python-version: '3.x' }
      - name: Install Dependencies
        run: pip install requests

      # 3. Generate your Custom DSA & CP Cards
      - name: Generate Futuristic DSA/CP Cards
        run: python scripts/generate_cards.py

      # 4. Generate the Contribution Snake
      - name: Generate Contribution Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # 5. COMMIT CUSTOM FILES FIRST (Crucial fix for rendering)
      - name: Commit Custom SVGs to Repo
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Auto-generate Live Custom Cards & Snake"
          file_pattern: 'dist/*.svg'

      # 6. Generate GRAPHICAL Lowlighter Metrics
      - name: Generate Graphical GitHub Analytics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: madhavkapila
          template: classic # Switched from terminal to graphical cards
          filename: github-metrics.svg
          config_timezone: Asia/Kolkata
          
          # Base Stats
          base: header, activity, repositories, metadata
          
          # Languages (Graphical breakdown)
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          
          # Coding Habits (Graphical charts of commit times/days)
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          
          # Official LeetCode Plugin (Graphical)
          plugin_leetcode: yes
          plugin_leetcode_user: SmartKapila
          plugin_leetcode_sections: solved, skills, recent