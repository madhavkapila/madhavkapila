name: Omni-Metrics Builder
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with: { python-version: '3.x' }
        
      - name: Install Dependencies
        run: pip install requests

      # Generates DSA, CP, and the new Custom YT Music Card
      - name: Generate Custom Cards
        run: python scripts/generate_cards.py

      - name: Generate Contribution Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Offline Trophies Generator
      - name: Generate GitHub Trophies Offline
        uses: ryo-ma/github-profile-trophy@master
        with:
          username: madhavkapila
          output_path: dist/github-trophies.svg
          token: ${{ secrets.METRICS_GITHUB_TOKEN }}

      # 🚀 THE FIX: Pull the AI Agent's commits before trying to push the SVGs
      - name: Sync with Remote (Fix Race Condition)
        run: |
          git config pull.rebase false
          git pull origin main

      - name: Commit Custom SVGs to Repo
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Auto-generate Live Custom Cards, Trophies & Snake"
          file_pattern: 'dist/*.svg'

      # CARD 1: Lifetime Languages
      - name: Generate Lifetime Languages Card
        uses: lowlighter/metrics@master
        with:
          token: ${{ secrets.METRICS_GITHUB_TOKEN }}
          user: madhavkapila
          template: classic
          config_theme: tokyonight
          filename: dist/github-metrics-languages.svg
          config_timezone: Asia/Kolkata
          base: "" 
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_indepth: yes
          plugin_languages_recent_days: 1000
          plugin_languages_recent_load: 1000

      # CARD 2: Isometric Commit Calendar
      - name: Generate Isometric Calendar
        uses: lowlighter/metrics@master
        with:
          token: ${{ secrets.METRICS_GITHUB_TOKEN }}
          user: madhavkapila
          template: classic
          config_theme: tokyonight
          filename: dist/github-metrics-isocalendar.svg
          config_timezone: Asia/Kolkata
          base: "" 
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year