name: Omni-Metrics Builder
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with: { python-version: '3.x' }
        
      - name: Install Dependencies
        run: pip install requests

      - name: Generate Futuristic DSA/CP Cards
        run: python scripts/generate_cards.py

      - name: Generate Contribution Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Commit Custom SVGs to Repo
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Auto-generate Live Custom Cards & Snake"
          file_pattern: 'dist/*.svg'

      # CARD 1: Native GitHub Trophies (MUST USE @master)
      - name: Generate Native Trophies
        uses: lowlighter/metrics@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: madhavkapila
          template: classic
          filename: github-metrics-trophies.svg
          config_timezone: Asia/Kolkata
          base: ""
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C

      # CARD 2: Habits & Languages (MUST USE @master to fix author bug)
      - name: Generate Habits & Languages Card
        uses: lowlighter/metrics@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: madhavkapila
          template: classic
          filename: github-metrics-habits.svg
          config_timezone: Asia/Kolkata
          base: "" 
          plugin_languages: yes
          plugin_languages_limit: 20
          plugin_languages_details: percentage
          plugin_languages_indepth: yes
          plugin_habits: yes
          plugin_habits_from: 1000
          plugin_habits_days: 60
          plugin_habits_facts: yes
          plugin_habits_trim: yes
          plugin_habits_charts: yes
          retries: 3
          retries_delay: 300

      # CARD 3: YouTube Music 
      - name: Generate YT Music Card
        uses: lowlighter/metrics@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: madhavkapila
          template: classic
          filename: github-metrics-music.svg
          config_timezone: Asia/Kolkata
          base: "" 
          plugin_music: yes
          plugin_music_provider: youtube
          plugin_music_mode: playlist
          plugin_music_playlist: PLiNce0QIvDSm00HL2FoOskaCFuNTEeR2v
          retries: 3

      # CARD 4: Isometric Commit Calendar
      - name: Generate Isometric Calendar
        uses: lowlighter/metrics@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: madhavkapila
          template: classic
          filename: github-metrics-isocalendar.svg
          config_timezone: Asia/Kolkata
          base: "" 
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year