name: Omni-Metrics Builder
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with: { python-version: '3.x' }
        
      - name: Install Dependencies
        run: pip install requests
        
      - name: Generate Live Futuristic DSA/CP Cards
        run: python scripts/generate_cards.py
        
      - name: Generate Contribution Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            
      - name: Commit Custom SVGs to Repo
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Auto-generate Live Custom Cards & Snake"
          file_pattern: 'dist/*.svg'

      - name: Generate GenZ Hacker Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: madhavkapila
          template: terminal
          filename: github-metrics.svg
          config_timezone: Asia/Kolkata
          
          # 1. Base Stats (Clean & Minimal)
          base: header, activity, repositories, metadata
          
          # 2. Lines of Code (Massive Aura Flex)
          plugin_lines: yes
          plugin_lines_history_limit: 1
          plugin_lines_repositories_limit: 50
          plugin_lines_sections: base
          
          # 3. 3D Isometric Calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          
          # 4. Coding Habits (Hacker Vibe)
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          
          # 5. YouTube Music Integration
          plugin_music: yes
          plugin_music_provider: youtube
          plugin_music_mode: playlist
          # IMPORTANT: Replace this with your public YouTube/YT Music playlist ID!
          plugin_music_playlist: RDCLAK5uy_kuo_NioExeUmw07dFf8BzQ64DFFTlgE7Q&playnext=1&si=S3Q89ibOQLXEdM0u