name: Omni-Metrics Builder
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with: { python-version: '3.x' }
        
      # INSTALL DEPENDENCIES FOR LIVE API FETCHING
      - name: Install Dependencies
        run: pip install requests
        
      - name: Generate Live Futuristic DSA/CP Cards
        run: python scripts/generate_cards.py
        
      - name: Generate Contribution Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            
      - name: Commit Custom SVGs to Repo
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Auto-generate Live Custom Cards & Snake"
          file_pattern: 'dist/*.svg'

      - name: Generate Lowlighter GitHub Analytics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: madhavkapila
          template: terminal
          base: header, activity, repositories, metadata
          config_timezone: Asia/Kolkata
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_languages: yes
          plugin_languages_limit: 8