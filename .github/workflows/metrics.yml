name: Omni-Metrics Builder
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 1. Checkout the code to run your custom Python script
      - uses: actions/checkout@v3
      
      # 2. Setup Python & Run your custom Codolio-style SVG generator
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Generate DSA Card
        run: python scripts/generate_dsa_card.py
        
      # 3. Generate the GitHub Contribution Snake
      - name: Generate Contribution Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            
      # 4. Commit the custom SVGs back to the repository (main branch)
      - name: Commit Custom SVGs
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Auto-generate DSA Card & Snake"
          file_pattern: 'dist/*.svg'

      # 5. Run Lowlighter Metrics (Replaces broken Vercel links)
      - name: Generate GitHub Metrics (Trophies, Stats, Languages)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: madhavkapila
          template: classic
          config_theme: tokyonight
          # Base Stats
          base: header, activity, community, repositories, metadata
          # Trophies (Replaces github-profile-trophy)
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
          # Streak/Activity Graph (Replaces github-readme-streak-stats)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          # Top Languages
          plugin_languages: yes
          plugin_languages_limit: 8