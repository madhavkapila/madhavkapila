name: Omni-Metrics Builder
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with: { python-version: '3.x' }
        
      - name: Install Dependencies
        run: pip install requests

      - name: Generate Futuristic DSA/CP Cards
        run: python scripts/generate_cards.py

      - name: Generate Contribution Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Commit Custom SVGs to Repo
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Auto-generate Live Custom Cards & Snake"
          file_pattern: 'dist/*.svg'

      - name: Generate Graphical GitHub Analytics
        uses: lowlighter/metrics@latest
        with:
          # IMPORTANT: Requires a Personal Access Token in your repo secrets for Traffic stats
          token: ${{ secrets.METRICS_TOKEN }}
          user: madhavkapila
          template: classic
          config_theme: tokyonight
          filename: github-metrics.svg
          config_timezone: Asia/Kolkata
          
          # 1. Base Stats (Replaces the broken github-readme-stats)
          base: header, activity, repositories
          
          # 2. Achievements (Replaces the broken github-profile-trophy)
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
          
          # 3. Coding Habits (Graphical charts)
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          
          # 4. Languages Used
          plugin_languages: yes
          plugin_languages_limit: 8
          
          # 5. Official LeetCode Plugin
          plugin_leetcode: yes
          plugin_leetcode_user: SmartKapila
          plugin_leetcode_sections: solved, skills, recent
          
          # 6. Repositories Traffic
          plugin_traffic: yes
          
          # 7. 3D Contribution Graph (Great for moderate activity)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year