name: Madhav AI Ecosystem

on:
  push: {branches: ["master", "main"]}
  schedule:
    - cron: '0 0 * * *' # Midnight cron
  workflow_dispatch:
  issues:
    types: [opened]

jobs:
  passive-pulse-and-db-build:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with: { python-version: '3.12' }
      - name: Install dependencies
        run: pip install requests google-genai
      - name: Build Vector DB & Generate Pulse
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/passive_pulse.py
          python scripts/build_vector_db.py
      - name: Commit DB & Profile Updates
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "🤖 System Update: Recompiled Vector DB & Daily Pulse"

  active-agent-fast:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with: { python-version: '3.12' }
      - name: Install Fast Dependencies
        run: pip install requests
      - name: Execute O(1) RAG Query
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python scripts/active_agent.py