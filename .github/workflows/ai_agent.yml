name: Madhav AI Ecosystem

on:
  schedule:
    - cron: '0 0 * * *' # Nightly Passive Pulse
  issues:
    types: [opened]     # Instant Active Agent

jobs:
  passive-pulse:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with: { python-version: '3.10' }
      - name: Install Dependencies
        run: pip install requests google-generativeai
      - name: Run Gemini Flash Daily Pulse
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/passive_pulse.py
      - name: Commit AI Update
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "🤖 AI Pulse: Daily Vibe Check"

  active-agent:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with: { python-version: '3.10' }
      - name: Install Dependencies
        run: pip install requests langchain langchain-community langchain-huggingface langchain-groq faiss-cpu sentence-transformers
      - name: Run Gemma 3 RAG Agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python scripts/active_agent.py